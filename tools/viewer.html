<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Dune model viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #d9a66b; overflow: hidden; font: 12px/1.3 Inter, system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 8px; top: 8px; background: rgba(20, 14, 8, 0.72); color: #f3e3c4; padding: 6px 10px; border-radius: 6px; }
      #hud a { color: #ffd890; margin-right: 8px; text-decoration: none; }
      #hud a.on { color: #fff; font-weight: 700; text-decoration: underline; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
